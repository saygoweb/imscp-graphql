"ISO-8601 instant in UTC, e.g. 2026-09-04T11:00:00Z."
scalar DateTime

"""
A 64-bit unsigned integer serialised as a decimal string, because a JSON
number is a double and disk and traffic figures exceed 2^53. Always bytes.
"""
scalar BigInt

"A domain name. Accepted as Unicode or as punycode; always returned as Unicode."
scalar DomainName

"An email address."
scalar EmailAddress

"""
A write-only value. Never appears in a response, and is redacted from the audit
log. Passwords are of this type.
"""
scalar Secret

interface Node {
  id: ID!
}

"""
Whether the i-MSCP backend has caught up with the panel's intent. A mutation
records an intent and the backend carries it out afterwards.
"""
type Provisioning {
  state: ProvisioningState!

  "The literal i-MSCP status string, for support and for forward compatibility."
  raw: String!

  "False while the backend still has work to do for this object."
  settled: Boolean!

  "The backend's failure text, when state is ERROR."
  message: String
}

enum ProvisioningState {
  "ok"
  OK

  "toadd, tochange, todelete, toenable, todisable, torestore, tochangepwd, topurge"
  PENDING

  "disabled"
  DISABLED

  "ordered — a domain alias awaiting the reseller's approval"
  ORDERED

  "Anything else. i-MSCP stores the backend's failure text in the status column."
  ERROR
}

interface Provisioned {
  provisioning: Provisioning!
}

enum Role {
  ADMIN
  RESELLER
  CUSTOMER
}

"""
A scope narrows what a credential may do; it never widens it. New values are
added over time, so a client must tolerate one it has not seen. A field whose
scope the credential does not carry answers FORBIDDEN rather than an empty
list, so that a narrowed token is never mistaken for an empty account.
"""
enum Scope {
  ACCOUNT_READ
  DOMAINS_READ
  DOMAINS_WRITE
  MAIL_READ
  MAIL_WRITE
  FTP_READ
  FTP_WRITE
  SQL_READ
  SQL_WRITE
  DNS_READ
  DNS_WRITE
  CUSTOMERS_READ
  CUSTOMERS_WRITE
  RESELLERS_READ
  RESELLERS_WRITE
}

enum Gender {
  MALE
  FEMALE
  UNSPECIFIED
}

type ContactDetails {
  firstName: String
  lastName: String
  gender: Gender
  company: String
  street1: String
  street2: String
  city: String
  state: String
  postCode: String
  country: String
  email: EmailAddress
  phone: String
  fax: String
}

"The account this request is acting as."
type Viewer {
  id: ID!
  username: String!
  role: Role!
  email: EmailAddress
  contact: ContactDetails!

  "The scopes the presented credential carries, which may be narrower than the role."
  scopes: [Scope!]!

  "Set when role is CUSTOMER."
  customer: Customer

  "Set when role is RESELLER."
  reseller: Reseller
}

"""
Anything Apache serves: a main domain, a subdomain, a domain alias or a
subdomain of an alias. i-MSCP keys these by the pair (type, id) with type in
dmn|sub|als|alssub; this interface is the same idea without four code paths.
"""
interface VirtualHost {
  id: ID!
  name: DomainName!

  "Path under the customer's web root, e.g. /shop."
  mountPoint: String!

  "Path under the mount point that Apache serves, e.g. /htdocs."
  documentRoot: String!

  forwarding: Forwarding

  "Whether *.name is served by this host as well."
  wildcard: Boolean!

  provisioning: Provisioning!
}

type Forwarding {
  url: String!
  type: ForwardType!

  "For PROXY only: whether the original Host header is preserved."
  keepHost: Boolean!
}

enum ForwardType {
  PERMANENT_301
  FOUND_302
  SEE_OTHER_303
  TEMPORARY_307
  PROXY
}

type Domain implements Node & Provisioned & VirtualHost {
  id: ID!
  name: DomainName!
  mountPoint: String!
  documentRoot: String!
  forwarding: Forwarding
  wildcard: Boolean!
  provisioning: Provisioning!
  customer: Customer!
  ipAddress: IpAddress!
  createdAt: DateTime!

  "Null when the account does not expire."
  expiresAt: DateTime

  subdomains: [Subdomain!]!
  aliases: [DomainAlias!]!
}

type Subdomain implements Node & Provisioned & VirtualHost {
  id: ID!
  name: DomainName!
  mountPoint: String!
  documentRoot: String!
  forwarding: Forwarding
  wildcard: Boolean!
  provisioning: Provisioning!

  "The label alone, without the parent's name."
  label: String!

  "A Domain, or a DomainAlias when this is a subdomain of an alias."
  parent: VirtualHost!

  customer: Customer!
}

type DomainAlias implements Node & Provisioned & VirtualHost {
  id: ID!
  name: DomainName!
  mountPoint: String!
  documentRoot: String!
  forwarding: Forwarding
  wildcard: Boolean!
  provisioning: Provisioning!
  domain: Domain!
  customer: Customer!
  subdomains: [Subdomain!]!
}

"""
One countable allowance. Normalises i-MSCP's three-valued limit columns:
-1 (feature withheld), 0 (unlimited), n (n).
"""
type Quota {
  "False when the feature is withheld from the account entirely."
  enabled: Boolean!

  "Null when unlimited."
  limit: Int

  used: Int!

  "limit - used, or null when unlimited. Never negative."
  remaining: Int
}

"All figures in bytes."
type Storage {
  "Null when unlimited."
  diskLimit: BigInt

  diskUsed: BigInt!
  diskFiles: BigInt!
  diskMail: BigInt!
  diskSql: BigInt!

  "Null when unlimited."
  trafficLimit: BigInt

  "This calendar month's web, FTP, mail and POP traffic added together."
  trafficUsed: BigInt!

  "Default per-mailbox quota. Null when unlimited."
  mailQuota: BigInt
}

type CustomerQuotas {
  subdomains: Quota!
  domainAliases: Quota!
  mailAccounts: Quota!
  ftpUsers: Quota!
  sqlDatabases: Quota!
  sqlUsers: Quota!
}

"What the panel itself would answer for this customer, verbatim and per name."
type CustomerFeatures {
  php: Boolean!
  phpEditor: Boolean!
  cgi: Boolean!
  customDns: Boolean!
  externalMail: Boolean!
  backup: Boolean!
  ssl: Boolean!
  webStats: Boolean!
  supportSystem: Boolean!
}

type Customer implements Node & Provisioned {
  id: ID!
  username: String!

  "The reseller's own reference for this customer (admin.customer_id)."
  reference: String

  contact: ContactDetails!

  """
  Null when the account's creator is not a reseller — admin.created_by is
  nullable, and an account created outside the reseller chain has no reseller
  to name.
  """
  reseller: Reseller

  createdAt: DateTime!

  "Null when the account does not expire."
  expiresAt: DateTime

  domain: Domain!
  quotas: CustomerQuotas!
  storage: Storage!
  features: CustomerFeatures!

  "Whether this account may use this API at all."
  apiAccess: Boolean!

  provisioning: Provisioning!

  "Subdomains of the main domain and of every alias alike."
  subdomains: [Subdomain!]!

  domainAliases: [DomainAlias!]!
  mailAccounts(filter: MailAccountFilter, page: PageInput): MailAccountConnection!
  ftpUsers(page: PageInput): FtpUserConnection!
  sqlDatabases: [SqlDatabase!]!
  sqlUsers: [SqlUser!]!
  dnsRecords: [DnsRecord!]!
}

type MailAccount implements Node & Provisioned {
  id: ID!
  address: EmailAddress!
  kind: MailAccountKind!

  "The vhost this address belongs to."
  host: VirtualHost!

  "Where a forward sends mail, or the addresses a catch-all delivers to. Empty for a mailbox that does not forward."
  forwardTo: [EmailAddress!]!

  "Null when unlimited. Bytes."
  quota: BigInt

  """
  Bytes currently held in the mailbox, from the maildirsize file the mail
  server maintains. Null when there is no mailbox, when no quota is set, or
  when the file cannot be read.
  """
  quotaUsed: BigInt

  "Whether POP/IMAP access is enabled (mail_users.po_active)."
  active: Boolean!

  autoresponder: Autoresponder
  provisioning: Provisioning!
}

enum MailAccountKind {
  MAILBOX
  FORWARD
  MAILBOX_AND_FORWARD
  CATCHALL
}

type Autoresponder {
  enabled: Boolean!
  message: String!
}

type FtpUser implements Node & Provisioned {
  id: ID!

  "user@domain — the FTP login."
  username: String!

  "Absolute path on the server."
  homeDirectory: String!

  customer: Customer!
  provisioning: Provisioning!
}

"""
Note the absence of `provisioning`. SQL databases and users are created
synchronously by the panel itself, not by the backend.
"""
type SqlDatabase implements Node {
  id: ID!
  name: String!
  customer: Customer!
  users: [SqlUser!]!
}

type SqlUser implements Node {
  id: ID!
  name: String!

  "The host the SQL user may connect from."
  host: String!

  "One row per grant, so a user granted on three databases appears in three."
  databases: [SqlDatabase!]!
}

type DnsRecord implements Node & Provisioned {
  id: ID!

  "The domain or alias this record hangs off."
  host: VirtualHost!

  name: String!
  class: DnsClass!
  type: DnsRecordType!
  value: String!

  """
  'custom_dns_feature' for a customer's own record; otherwise the name of the
  plugin that owns it. A record owned by a plugin is read-only here.
  """
  ownedBy: String!

  provisioning: Provisioning!
}

enum DnsClass {
  IN
  CH
  HS
}

enum DnsRecordType {
  A
  AAAA
  CERT
  CNAME
  DNAME
  GPOS
  KEY
  KX
  MX
  NAPTR
  NSAP
  NS
  NXT
  PTR
  PX
  SIG
  SRV
  TXT
  SPF
}

type IpAddress implements Node {
  id: ID!
  address: String!
  netmask: Int
  card: String
}

"One allowance a hosting plan grants, before any customer has used any of it."
type PlanAllowance {
  "False when the plan withholds the feature entirely."
  enabled: Boolean!

  "Null when unlimited."
  limit: Int
}

type PlanQuotas {
  subdomains: PlanAllowance!
  domainAliases: PlanAllowance!
  mailAccounts: PlanAllowance!
  ftpUsers: PlanAllowance!
  sqlDatabases: PlanAllowance!
  sqlUsers: PlanAllowance!
}

"All figures in bytes. Null means unlimited."
type PlanStorage {
  disk: BigInt
  traffic: BigInt
  mailQuota: BigInt
}

enum BackupTarget {
  DOMAIN
  SQL
  MAIL
}

type PlanFeatures {
  php: Boolean!
  phpEditor: Boolean!
  cgi: Boolean!
  customDns: Boolean!
  externalMail: Boolean!
  webFolderProtection: Boolean!

  "Empty when the plan grants no backup at all."
  backup: [BackupTarget!]!
}

type HostingPlan implements Node {
  id: ID!
  name: String!
  description: String
  reseller: Reseller!
  available: Boolean!
  quotas: PlanQuotas!
  storage: PlanStorage!
  features: PlanFeatures!
}

"""
A reseller's own allowances. Unlike a customer's, these have no withheld
state: 0 means unlimited.
"""
type ResellerQuotas {
  customers: Quota!
  subdomains: Quota!
  domainAliases: Quota!
  mailAccounts: Quota!
  ftpUsers: Quota!
  sqlDatabases: Quota!
  sqlUsers: Quota!
}

"""
A reseller. A customer may read the identity of their own reseller — id,
username and contact details — and nothing else: every other field answers
FORBIDDEN for a caller who is not that reseller or an administrator.
"""
type Reseller implements Node & Provisioned {
  id: ID!
  username: String!
  contact: ContactDetails!
  createdAt: DateTime!
  provisioning: Provisioning!

  "Reseller or administrator only."
  quotas: ResellerQuotas!

  "Reseller or administrator only. All figures in bytes."
  storage: Storage!

  "Reseller or administrator only."
  ipAddresses: [IpAddress!]!

  "Reseller or administrator only."
  apiAccess: Boolean!

  """
  The customers of this reseller that the caller may reach. A customer asking
  sees only themselves.
  """
  customers(filter: CustomerFilter, page: PageInput): CustomerConnection!

  "Reseller or administrator only."
  hostingPlans: [HostingPlan!]!
}

"limit is capped at 200 by the server regardless of what is asked for."
input PageInput {
  limit: Int = 50
  offset: Int = 0
}

input CustomerFilter {
  username: String
  domainName: DomainName
  state: ProvisioningState

  "Administrators only; ignored for a reseller, who only ever sees their own."
  resellerId: ID
}

input ResellerFilter {
  username: String
  state: ProvisioningState
}

input MailAccountFilter {
  kind: MailAccountKind

  "Substring match on the address, as the panel's own list does."
  address: String
  state: ProvisioningState
}

type CustomerConnection {
  totalCount: Int!
  nodes: [Customer!]!
}

type MailAccountConnection {
  totalCount: Int!
  nodes: [MailAccount!]!
}

type FtpUserConnection {
  totalCount: Int!
  nodes: [FtpUser!]!
}

type ResellerConnection {
  totalCount: Int!
  nodes: [Reseller!]!
}

type Query {
  "The schema version this endpoint serves. See docs/SPECIFICATION.md section 18."
  apiVersion: String!

  viewer: Viewer!

  "Any object by its opaque identifier. Null when the caller cannot reach it."
  node(id: ID!): Node

  customer(id: ID!): Customer
  customers(filter: CustomerFilter, page: PageInput): CustomerConnection!
  reseller(id: ID!): Reseller
  resellers(filter: ResellerFilter, page: PageInput): ResellerConnection!

  "Everything the caller owns that the backend has not finished with."
  pending: [Node!]!
}

"""
Changes to what the caller may reach.

Each field is one object in one transaction (spec section 8.1). Fields in one
document run in the order they are written, and they are NOT one transaction:
each commits on its own, so a document whose third mutation fails leaves the
first two done. Send one mutation per request unless that is what you want.

A mutation returns as soon as its intent is recorded. The object it returns
has provisioning.state PENDING - or ORDERED, for a customer's new domain alias
- until the i-MSCP backend has done the work, which takes seconds. Poll
node(id:) or pending to watch it settle; a backend failure appears there as
state ERROR, not as an error here.

An object whose provisioning is not settled cannot be changed: CONFLICT, with
extensions.retryAfterSeconds. A failed (ERROR) object can still be deleted.

Every field of this type is non-null, so an error in any one of them has no
nullable ancestor to stop at: it propagates to the root and nulls the whole
response's data, including fields that ran - and committed - before it. The
work those earlier fields did still happened; read it back with node(id:) or
pending rather than from this response.
"""
type Mutation {
  "Forwarding, document root and wildcard of a customer's main domain."
  domainUpdate(id: ID!, input: DomainUpdateInput!): Domain!

  subdomainCreate(input: SubdomainCreateInput!): Subdomain!
  subdomainUpdate(id: ID!, input: SubdomainUpdateInput!): Subdomain!

  """
  Schedules the subdomain for deletion, with its FTP users, mail accounts,
  certificates and protected areas.
  """
  subdomainDelete(id: ID!): Subdomain!

  """
  A customer's new alias is ORDERED until their reseller approves it. One
  created by the reseller or an administrator is PENDING.
  """
  domainAliasCreate(input: DomainAliasCreateInput!): DomainAlias!

  domainAliasUpdate(id: ID!, input: DomainAliasUpdateInput!): DomainAlias!

  """
  An ORDERED alias is withdrawn at once. Any other is scheduled for deletion
  with everything under it.
  """
  domainAliasDelete(id: ID!): DomainAlias!

  """
  A mailbox needs a password, and a quota when the account has a mail quota.
  A forward needs forwardTo. MAILBOX_AND_FORWARD needs both.
  """
  mailAccountCreate(input: MailAccountCreateInput!): MailAccount!

  "Absent fields are kept. Turning a forward into a mailbox needs a password and, where the account has a mail quota, a quota."
  mailAccountUpdate(id: ID!, input: MailAccountUpdateInput!): MailAccount!

  """
  Also removes the address from the customer's other forwards and catch-alls;
  one left with nothing to deliver to is deleted with it. The panel's
  settings may protect the default accounts (abuse, hostmaster, postmaster,
  webmaster), which is FORBIDDEN.
  """
  mailAccountDelete(id: ID!): MailAccount!

  mailAutoresponderSet(id: ID!, input: AutoresponderInput!): MailAccount!

  "One per host. A second is CONFLICT."
  mailCatchallCreate(input: MailCatchallCreateInput!): MailAccount!

  mailCatchallDelete(id: ID!): MailAccount!
}

input ForwardingInput {
  """
  http, https or ftp. Normalised as the panel normalises it: host lower-cased,
  path given a trailing slash. A host may not forward to its own root.
  """
  url: String!
  type: ForwardType!

  "PROXY only: pass the original Host header through."
  keepHost: Boolean = false
}

"""
An absent field keeps its current value; forwarding: null removes forwarding.
A forwarded host serves no document root, so documentRoot is refused unless
forwarding is off after the update.
"""
input DomainUpdateInput {
  "/htdocs, or a directory inside it that already exists - the same terms VirtualHost.documentRoot reads in."
  documentRoot: String
  forwarding: ForwardingInput
  wildcard: Boolean
}

input SubdomainCreateInput {
  "The Domain or DomainAlias to hang it off."
  parentId: ID!

  "The label alone, e.g. 'shop'. Unicode or punycode. 'www' is not allowed."
  label: String!

  "Serve the directory of another of the same customer's hosts instead of creating one. That host must be settled and not forwarded."
  sharedMountPointOf: ID
  forwarding: ForwardingInput
  wildcard: Boolean = false
}

"As DomainUpdateInput."
input SubdomainUpdateInput {
  documentRoot: String
  forwarding: ForwardingInput
  wildcard: Boolean
}

input DomainAliasCreateInput {
  "The customer's main domain."
  domainId: ID!

  "Unicode or punycode. A leading www. is dropped."
  name: DomainName!
  sharedMountPointOf: ID
  forwarding: ForwardingInput
  wildcard: Boolean = false
}

"As DomainUpdateInput."
input DomainAliasUpdateInput {
  documentRoot: String
  forwarding: ForwardingInput
  wildcard: Boolean
}

input MailAccountCreateInput {
  "The Domain, Subdomain or DomainAlias the address is on."
  hostId: ID!

  "The part before the @."
  localPart: String!

  "MAILBOX, FORWARD or MAILBOX_AND_FORWARD. CATCHALL has its own mutation."
  kind: MailAccountKind!
  password: Secret

  """
  Bytes, and a whole number of MiB. Null or absent for no quota, which is
  refused when the account has a mail quota: then every mailbox needs one,
  within what the others leave (extensions.maximum when it does not fit).
  """
  quota: BigInt
  forwardTo: [EmailAddress!]
}

"An absent field keeps its current value."
input MailAccountUpdateInput {
  kind: MailAccountKind
  password: Secret
  quota: BigInt
  forwardTo: [EmailAddress!]
}

input AutoresponderInput {
  enabled: Boolean!

  "Required to enable one that has never had a message. Absent keeps the stored message."
  message: String
}

input MailCatchallCreateInput {
  "The Domain, Subdomain or DomainAlias whose unmatched addresses are caught."
  hostId: ID!

  "Where caught mail is delivered."
  addresses: [EmailAddress!]!
}
